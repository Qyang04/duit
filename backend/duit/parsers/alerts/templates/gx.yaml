# GX Bank alerts (alerts@gxbank.my), sent through Amazon SES and signed by gxbank.my too
# (DMARC p=REJECT). Layouts learned from masked copies (tools/email_layout.py).

- name: gx-received
  version: 1
  sender: alerts@gxbank.my
  dkim: gxbank.my
  institution: GX Bank
  direction: in
  subject: '^Money received$'
  # You've received RM12.50 from TAN AH KOW.   (no date: the email's Date header is used)
  body: '^You''ve received RM(?P<amount>[0-9,]+\.[0-9]{2}) from (?P<counterparty>.+)\.$'
