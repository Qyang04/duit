[project]
name = "duit"
version = "0.1.0"
description = "Duit: personal finance and tax copilot (API + worker)"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.32.0",
    "cryptography>=50.0.2",
    "fastapi>=0.162.7",
    "pydantic[email]>=2.14.3",
    "pydantic-settings>=2.16.3",
    "pyotp>=2.11.2",
    "sqlalchemy[asyncio]>=2.1.8",
    "uvicorn>=0.54.0",
    "pdfplumber>=0.11.10",
    "pdfminer-six>=20260107",
    "python-multipart>=0.0.33",
    "procrastinate>=3.11.0",
]

[dependency-groups]
dev = [
    "deptry>=0.25.1",
    "fpdf2>=2.9.0",
    "httpx2>=2.16.0",
    "psycopg[binary]>=3.3.9",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, bugbear, pyupgrade, simplify, bandit (security)
select = ["E", "F", "I", "B", "UP", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101", # assert is how pytest works
    "S105", # fake passwords in test data
    "S106", # fake password hashes in test data
]

[tool.pyright]
typeCheckingMode = "strict"
include = ["duit", "tests", "tools"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["error"] # a deprecation fails CI now, not silently later

[tool.deptry]
known_first_party = ["duit"]

[tool.deptry.per_rule_ignores]
DEP002 = [
    "uvicorn", # the ASGI server: run as a command (Dockerfile), never imported
    "asyncpg", # Postgres driver: loaded by SQLAlchemy from the "+asyncpg" URL scheme
    "python-multipart", # parses file uploads: loaded by FastAPI for File() and Form()
]
