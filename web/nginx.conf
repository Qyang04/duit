# Serves the static export. Runs as nginx-unprivileged (UID 101, port 8080) with a read-only
# root filesystem: everything nginx writes goes to /tmp (an emptyDir in Kubernetes).
# The API is not proxied here: the Ingress routes /api to the API Service directly.

pid /tmp/nginx.pid;
worker_processes 1;

events {
  worker_connections 512;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  access_log /dev/stdout;
  error_log /dev/stderr warn;

  server_tokens off;
  sendfile on;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;

  server {
    listen 8080;
    root /usr/share/nginx/html;
    # Behind Traefik the request is http; never build absolute redirects from it.
    absolute_redirect off;

    include /etc/nginx/security-headers.conf;

    # Hashed file names never change content: cache them for a year.
    location /_next/static/ {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      try_files $uri =404;
    }

    # Pages: always revalidate, so a deploy is visible on the next load.
    location / {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-cache" always;
      try_files $uri $uri/index.html =404;
    }

    error_page 404 /404.html;

    # Kubernetes probes; not logged.
    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }
  }
}
