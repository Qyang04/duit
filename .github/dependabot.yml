# Weekly update PRs; CI must pass before anything is merged.
version: 2
updates:
  - package-ecosystem: github-actions # bumps the pinned SHAs (and their version comments)
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: uv
    directory: /backend
    schedule: { interval: weekly }
    groups:
      python: { patterns: ["*"] }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    ignore:
      # A new Python version (3.13 -> 3.14) is a deliberate upgrade with an ADR, not a weekly bump.
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
