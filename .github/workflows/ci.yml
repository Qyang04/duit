# CI: checks on every push and PR; on main, the scanned images are pushed to GHCR.
# Actions are pinned to full commit SHAs (tags can be moved); Dependabot proposes updates.
name: ci

on:
  push:
    branches: [main]
    paths-ignore: # manifests and docs do not change the image
      - "deploy/**"
      - "docs/**"
      - "**.md"
  pull_request:

permissions:
  contents: read # least privilege by default; jobs ask for more only if they need it

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TRIVY_VERSION: v0.76.2 # the scanner itself, pinned separately from the action

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    services:
      postgres: # same Postgres as compose.yaml and the cluster
        image: postgres:18.6
        env:
          POSTGRES_USER: duit
          POSTGRES_PASSWORD: duit
          POSTGRES_DB: duit
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U duit -d duit"
          --health-interval 2s --health-timeout 3s --health-retries 15
    env:
      DUIT_DATABASE_URL: postgresql+asyncpg://duit:duit@127.0.0.1:5432/duit
      DUIT_DATA_KEY: ZGV2LW9ubHkta2V5LW5vdC1mb3ItcmVhbC1kYXRhISE= # public dev/test key, see .env.example
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install (exactly as locked)
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Types
        run: uv run pyright
      - name: Dependencies
        run: uv run deptry .
      - name: Migrate
        run: uv run alembic upgrade head
      - name: Models match migrations
        run: uv run alembic check
      - name: Tests
        run: uv run pytest
      - name: OpenAPI schema is committed and current
        # The web client is generated from web/openapi.json: an API change without a regenerated
        # schema would leave the web app calling endpoints that no longer exist.
        run: |
          uv run python -m tools.export_openapi
          git diff --exit-code -- ../web/openapi.json

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install (exactly as locked)
        run: npm ci --no-audit --no-fund
      - name: Generated API client matches openapi.json
        run: npm run check:api
      - name: Types
        run: npm run typecheck
      - name: Static export
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  # One job definition, two images: both get the same build, scan, SBOM and push steps.
  image:
    needs: [test, web]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true # never deploy one new image next to one old one
      matrix:
        name: [api, web]
    permissions:
      contents: read
      packages: write # push to GHCR (used only on main)
    env:
      IMAGE: ghcr.io/qyang04/duit-${{ matrix.name }} # GHCR names must be lowercase
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=main,enable={{is_default_branch}}
      - name: Build (load locally, not pushed yet)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.${{ matrix.name }}
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Smoke test (the worker's driver loads Debian's libpq)
        # Tests use the psycopg-binary wheel; only the image uses the system libpq. Check it here,
        # not by a worker crash-looping in the cluster.
        if: matrix.name == 'api'
        run: docker run --rm "$IMAGE:${{ steps.meta.outputs.version }}" python -c "import psycopg; assert psycopg.pq.__impl__ == 'python', psycopg.pq.__impl__"
      - name: Scan (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          skip-setup-trivy: true
          image-ref: ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
          format: cyclonedx
          output: sbom.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ matrix.name }}-${{ github.sha }} # one per image and commit, like the sha- tag
          path: sbom.cdx.json
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the exact image that was scanned
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push --all-tags "$IMAGE"

  # GitOps: CI never touches the cluster. It writes the new tag into Git; Argo CD deploys it.
  # Commits made with GITHUB_TOKEN do not start new workflow runs, so this cannot loop.
  deploy-staging:
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write # commit the tag bump to main
    steps:
      - name: Immutable tag of this commit's images (sha-<short>, as metadata-action wrote it)
        run: echo "TAG=sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Point staging at the new images (api and web)
        run: |
          case "$TAG" in sha-*) ;; *) echo "refusing non-immutable tag $TAG"; exit 1;; esac
          sed -i -E "s/^(\s*newTag: )\S+/\1${TAG}/" deploy/overlays/staging/kustomization.yaml
          # fail loudly if sed missed one: exactly two images, both on this commit
          test "$(grep -c "newTag: ${TAG}" deploy/overlays/staging/kustomization.yaml)" = 2
          git diff --stat
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Deploy ${TAG} to staging" || { echo "already on ${TAG}"; exit 0; }
          for _ in 1 2 3; do # main may have moved while we built; rebase and retry
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
