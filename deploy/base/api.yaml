apiVersion: apps/v1
kind: Deployment
metadata:
  name: duit-api
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: duit-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: duit-api
    spec:
      automountServiceAccountToken: false # the API never talks to Kubernetes
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: api
          image: ghcr.io/qyang04/duit-api
          ports:
            - { name: http, containerPort: 8000 }
          envFrom:
            - configMapRef: { name: duit-config }
          env:
            - name: DUIT_DATABASE_URL
              valueFrom:
                secretKeyRef: { name: duit-db-app, key: uri }
            - name: DUIT_DATA_KEY # encrypts sensitive columns; each overlay supplies its own
              valueFrom:
                secretKeyRef: { name: duit-app-secrets, key: data-key }
          readinessProbe: # out of the Service while the database is unreachable
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe: # restart only if the process itself hangs
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 20m, memory: 96Mi }
            limits: { memory: 192Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: duit-api
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  selector:
    app.kubernetes.io/name: duit-api
  ports:
    - { name: http, port: 80, targetPort: http }
