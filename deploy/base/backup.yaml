# A base backup every night at 03:00 UTC (11:00 in Malaysia, when nothing imports), plus one right
# away when this is first created. Between base backups, WAL is archived continuously, so a restore
# can reach any moment, not just 03:00 (RPO = minutes). Each overlay supplies ObjectStore duit-backups.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: duit-db-nightly
spec:
  schedule: "0 0 3 * * *" # CNPG cron has a seconds field first
  immediate: true
  backupOwnerReference: self # Backup objects belong to this ScheduledBackup, pruned with it
  cluster:
    name: duit-db
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
