# Postgres via CloudNativePG. The operator creates the `duit` database and owner, and writes
# the credentials to Secret duit-db-app (keys: username, password, host, uri, ...).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: duit-db
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  instances: 1
  # Pinned: a CNPG upgrade must never change the Postgres version on its own.
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-minimal-trixie
  bootstrap:
    initdb:
      database: duit
      owner: duit
  postgresql:
    parameters:
      shared_buffers: 64MB
  # Continuous backup: the Barman Cloud plugin archives every WAL segment to the overlay's
  # ObjectStore duit-backups (base backups: backup.yaml). Restore drill: docs/runbooks.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: duit-backups
  storage:
    size: 2Gi
  resources:
    requests: { cpu: 50m, memory: 256Mi }
    limits: { memory: 256Mi }
