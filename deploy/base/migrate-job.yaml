# Runs `alembic upgrade head` from the API image on every sync, after Postgres is healthy and
# before the API rolls out. A failed migration stops the sync, so the old API keeps serving.
apiVersion: batch/v1
kind: Job
metadata:
  name: duit-migrate
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation # keep the last run for its logs
    argocd.argoproj.io/sync-wave: "0"
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: duit-migrate
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: migrate
          image: ghcr.io/qyang04/duit-api
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef: { name: duit-config }
          env:
            - name: DUIT_DATABASE_URL
              valueFrom:
                secretKeyRef: { name: duit-db-app, key: uri }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 20m, memory: 96Mi }
            limits: { memory: 192Mi }
