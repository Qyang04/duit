apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: duit-api
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts: [duit-staging.luiqiuyang.com]
      secretName: duit-staging-tls
  rules:
    - host: duit-staging.luiqiuyang.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: duit-api
                port: { name: http }
