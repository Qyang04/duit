# KSOPS decrypts the SOPS file inside Argo CD's repo-server (cluster age key) and hands the
# plain Secret to kustomize. Plaintext never touches Git. Edit with: sops secrets.enc.yaml
apiVersion: viaduct.ai/v1
kind: ksops
metadata:
  name: duit-staging-secrets
  annotations:
    config.kubernetes.io/function: |
      exec:
        path: ksops
files:
  - secrets.enc.yaml
  - backup-r2.enc.yaml # R2 credentials for Postgres backups (Secret duit-backup-r2)
